<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NFL player and team stats — Mid Stats">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
    <title>NFL Stats — Mid Stats</title>
    <link rel="stylesheet" href="shared.css?v=3">
    <link rel="stylesheet" href="stats.css?v=7">
</head>
<body>

    <nav id="navbar">
        <a href="/" class="nav-brand" title="Mid Stats">
            <span class="nav-emoji">🏈</span>
            <span class="nav-label" style="font-size:.55rem;font-weight:700;letter-spacing:.6px;color:rgba(175,215,255,.65);text-transform:uppercase">Mid</span>
        </a>
        <a href="/" class="nav-link" title="Home">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
            <span class="nav-label">Home</span>
        </a>
        <a href="/games.html" class="nav-link" title="Games">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="15" rx="2"/><path d="M8 5V3M16 5V3"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="12" y1="10" x2="12" y2="20"/></svg>
            <span class="nav-label">Games</span>
        </a>
        <a href="/stats.html" class="nav-link active" title="NFL Stats">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="4" y="13" width="4" height="8" rx="1"/><rect x="10" y="5" width="4" height="16" rx="1"/><rect x="16" y="9" width="4" height="12" rx="1"/></svg>
            <span class="nav-label">Stats</span>
        </a>
        <a href="/fantasy.html" class="nav-link" title="Fantasy">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 01-2-2V5h4"/><path d="M18 9h2a2 2 0 002-2V5h-4"/><path d="M6 3h12v7a6 6 0 01-12 0z"/><path d="M12 16v2"/><path d="M9 22h6"/><path d="M10 18h4"/></svg>
            <span class="nav-label">Fantasy</span>
        </a>
        <a href="/NFL-Wordle.html" class="nav-link" title="NFL Wordle">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span class="nav-label">Wordle</span>
        </a>
    </nav>

    <main>

        <!-- Season selector -->
        <div class="season-bar">
            <span class="season-bar-label">Season</span>
            <select id="season-select" class="stats-select">
                <option value="2026">2026 Season (Live)</option>
                <option value="2025">2025 Season</option>
            </select>
            <span id="season-note" class="season-note"></span>
        </div>

        <!-- Top-level tabs: Players / Teams -->
        <div class="page-tabs">
            <button class="page-tab active" data-panel="panel-players">Player Stats</button>
            <button class="page-tab" data-panel="panel-teams">Team Stats</button>
        </div>

        <!-- ===== PLAYER STATS ===== -->
        <div id="panel-players" class="page-panel">

            <div class="sub-tabs">
                <button class="sub-tab active" data-panel="sub-compare">Comparison</button>
                <button class="sub-tab" data-panel="sub-pcharts">Charts</button>
            </div>

            <!-- Player Comparison -->
            <div id="sub-compare" class="sub-panel">
                <div class="compare-controls">
                    <div class="control-group">
                        <label class="control-label">Position</label>
                        <select id="pos-select" class="stats-select">
                            <option value="QB" selected>QB</option>
                            <option value="RB">RB</option>
                            <option value="WR">WR</option>
                            <option value="TE">TE</option>
                        </select>
                    </div>
                    <div id="player-selects" class="player-selects">
                        <p class="loading-note">Loading players…</p>
                    </div>
                </div>
                <div id="compare-table-wrap"></div>
            </div>

            <!-- Player Charts -->
            <div id="sub-pcharts" class="sub-panel hidden">
                <div class="chart-pos-tabs">
                    <button class="chart-pos-btn active" data-pos="QB">QB</button>
                    <button class="chart-pos-btn" data-pos="RB">RB</button>
                    <button class="chart-pos-btn" data-pos="WR">WR</button>
                    <button class="chart-pos-btn" data-pos="TE">TE</button>
                </div>
                <div id="player-charts-area"></div>
            </div>

        </div>

        <!-- ===== TEAM STATS ===== -->
        <div id="panel-teams" class="page-panel hidden">

            <div class="sub-tabs">
                <button class="sub-tab active" data-panel="sub-tlist">Rankings</button>
                <button class="sub-tab" data-panel="sub-tcharts">Charts</button>
            </div>

            <!-- Team Rankings Table -->
            <div id="sub-tlist" class="sub-panel">
                <p class="section-note">All 32 NFL Teams — 2025 Season. Click a column header to sort.</p>
                <div class="table-scroll">
                    <table id="team-table" class="stats-table">
                        <thead>
                            <tr>
                                <th class="col-team">Team</th>
                                <th class="sortable" data-col="ppg">PPG <span class="sort-icon">⇅</span></th>
                                <th class="sortable" data-col="ypg">YPG <span class="sort-icon">⇅</span></th>
                                <th class="sortable" data-col="yapg">Yds Allowed/G <span class="sort-icon">⇅</span></th>
                                <th class="sortable" data-col="papg">Pts Allowed/G <span class="sort-icon">⇅</span></th>
                                <th class="sortable" data-col="sos">Opp. SOS <span class="sort-icon">⇅</span></th>
                            </tr>
                            <tr class="filter-row">
                                <td><input class="filter-input" data-col="name" placeholder="Filter team…"></td>
                                <td><input class="filter-input" data-col="ppg" placeholder="e.g. >25"></td>
                                <td><input class="filter-input" data-col="ypg" placeholder="e.g. >350"></td>
                                <td><input class="filter-input" data-col="yapg" placeholder="e.g. <340"></td>
                                <td><input class="filter-input" data-col="papg" placeholder="e.g. <25"></td>
                                <td><input class="filter-input" data-col="sos" placeholder="e.g. >0.5"></td>
                            </tr>
                        </thead>
                        <tbody id="team-tbody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Team Charts -->
            <div id="sub-tcharts" class="sub-panel hidden">
                <p class="section-note">All 32 NFL Teams — 2025 Season</p>
                <div id="team-charts"></div>
            </div>

        </div>

    </main>

    <script src="stats.js?v=7" defer></script>
</body>
</html>
